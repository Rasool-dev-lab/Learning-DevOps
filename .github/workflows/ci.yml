name: Docker Compose CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.RASOOL_DOCKERHUB }}
          password: ${{ secrets.RASOOL_DOCKERHUB_TOKEN }}

      - name: Check Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps

      - name: Test application
        run: curl -f http://localhost:8080

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push rasooldockerhub5/learning-devops-web:latest

      - name: Stop containers
        if: always()
        run: docker compose down


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.RASOOL_DOCKERHUB }}
          password: ${{ secrets.RASOOL_DOCKERHUB_TOKEN }}

      - name: Add Docker to PATH
        shell: powershell
        run: |
          $dockerDir = "C:\Users\91901\AppData\Local\Programs\DockerDesktop\resources\bin"
          $dockerDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pull latest image
        shell: powershell
        run: |
          $docker = "C:\Users\91901\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

          & $docker --version

          & $docker pull rasooldockerhub5/learning-devops-web:latest

          if ($LASTEXITCODE -ne 0) {
              exit 1
          }

      - name: Deploy website
        shell: powershell
        run: |
          $docker = "C:\Users\91901\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

          & $docker rm -f cd-web 2>$null

          & $docker run -d `
            --name cd-web `
            --restart unless-stopped `
            -p 8080:80 `
            rasooldockerhub5/learning-devops-web:latest

          if ($LASTEXITCODE -ne 0) {
              exit 1
          }

      - name: Verify website
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          Invoke-WebRequest http://localhost:8080 -UseBasicParsing
